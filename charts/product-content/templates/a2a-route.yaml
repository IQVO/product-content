{{- if and .Values.a2a.enabled .Values.a2a.route.enabled -}}
{{- /*
A2A exposure through the Gateway API (Kong in the cluster; the same HTTPRoute
shape as httproute.yaml).

Host contract: a2a.route.path (default /api/a2a/product-content) -> Service
<release>-a2a:8093, prefix rewritten to / (the JSON-RPC root; the well-known
agent card at /.well-known/agent-card.json stays reachable under the same
prefix; /healthz deliberately stays off the host, it is a Kubernetes probe
concern, not a public endpoint).

NO auth plugin: endpoints are unauthenticated by fleet-wide decision.
*/ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "product-content.a2aFullname" . }}
  labels:
    {{- include "product-content.labels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
spec:
  parentRefs:
    {{- range .Values.a2a.route.parentRefs }}
    - name: {{ .name }}
      namespace: {{ .namespace }}
      {{- if .sectionName }}
      sectionName: {{ .sectionName }}
      {{- end }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.a2a.route.path }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: {{ include "product-content.a2aFullname" . }}
          port: {{ .Values.a2a.service.port }}
{{- end }}
